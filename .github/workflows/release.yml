name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: '待发布标签（vX.Y.Z）'
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

# Requires repo Settings > Actions > General > Workflow permissions
# set to "Read and write permissions" for GITHUB_TOKEN to create releases.
permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows release
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mod_UI/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mod_UI/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: mod_UI
        run: npm ci

      - name: Require updater signing key
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            Write-Host '缺少仓库 Secret TAURI_SIGNING_PRIVATE_KEY。'
            Write-Host '没有签名密钥就不会产出 .sig 与 latest.json，发布出去的应用永远无法自动更新。'
            Write-Host '请在 Settings > Secrets and variables > Actions 中配置：'
            Write-Host '  TAURI_SIGNING_PRIVATE_KEY          —— mod_UI/tauri.key.regenerated 的内容'
            Write-Host '  TAURI_SIGNING_PRIVATE_KEY_PASSWORD —— 密钥密码（无密码则留空）'
            Write-Host '并确认 tauri.conf.json 的 plugins.updater.pubkey 与私钥同属一对密钥。'
            throw '缺少 TAURI_SIGNING_PRIVATE_KEY，拒绝发布无法自动更新的版本。'
          }
          Write-Host '签名密钥已配置。'

      - name: Validate release tag
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag must match vX.Y.Z, got '$env:RELEASE_TAG'"
          }
          $packageVersion = (Get-Content -LiteralPath "mod_UI\package.json" -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$packageVersion") {
            throw "Release tag $env:RELEASE_TAG does not match package.json version v$packageVersion"
          }

      - name: Validate tests and build before publishing
        working-directory: mod_UI
        shell: pwsh
        run: |
          $packageVersion = (Get-Content -LiteralPath 'package.json' -Raw -Encoding UTF8 | ConvertFrom-Json).version
          $tauriVersion = (Get-Content -LiteralPath 'src-tauri\tauri.conf.json' -Raw -Encoding UTF8 | ConvertFrom-Json).version
          $cargoVersion = (Select-String '^version\s*=\s*"([^"]+)"' 'src-tauri\Cargo.toml').Matches[0].Groups[1].Value
          if ($packageVersion -ne $tauriVersion -or $packageVersion -ne $cargoVersion) { throw '版本号不一致' }
          npm test -- --run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run check:size
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --manifest-path src-tauri\Cargo.toml -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path src-tauri\Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --manifest-path src-tauri\Cargo.toml --all-targets --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # 这里只验证编译与测试；签名构建由 tauri-action 完成，
          # 若在此处直接 build 会因缺少签名环境变量而失败。
          node .\node_modules\@tauri-apps\cli\tauri.js build --no-bundle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $global:LASTEXITCODE = 0
          exit 0

      - name: Build and upload Tauri assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: mod_UI
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: ${{ env.RELEASE_TAG }}
          releaseBody: "Windows installation packages for ${{ env.RELEASE_TAG }}"
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      - name: Rename portable executable
        shell: pwsh
        run: |
          Copy-Item -LiteralPath "mod_UI\src-tauri\target\release\mod_ui.exe" -Destination "mod_UI\src-tauri\target\release\R_Package_Command_Center_Portable.exe" -Force

      - name: Upload additional release assets
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ env.RELEASE_TAG }}
          draft: false
          files: |
            mod_UI/src-tauri/target/release/R_Package_Command_Center_Portable.exe

      - name: Validate updater manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:RELEASE_TAG
          New-Item -ItemType Directory -Path "updater-check" -Force | Out-Null

          $downloaded = $false
          for ($i = 1; $i -le 3; $i++) {
            Write-Host "Attempt $i/3: Downloading latest.json via gh release download..."
            try {
              $null = gh release download $tag --pattern "latest.json" --dir "updater-check" --clobber 2>&1
            } catch {}

            if (Test-Path -LiteralPath "updater-check\latest.json") {
              $downloaded = $true
              Write-Host "Successfully downloaded latest.json via GitHub CLI"
              break
            }

            Write-Host "Attempt $i/3: Fetching latest.json via Web Request..."
            $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/latest.json"
            try {
              Invoke-WebRequest -Uri $url -OutFile "updater-check\latest.json" -Headers @{ "User-Agent" = "GitHubActions" } -ErrorAction SilentlyContinue
              if (Test-Path -LiteralPath "updater-check\latest.json") {
                $downloaded = $true
                Write-Host "Successfully downloaded latest.json via Web Request"
                break
              }
            } catch {
              Write-Host "Web Request failed: $_"
            }
            Start-Sleep -Seconds 3
          }

          if (-not $downloaded) {
            Write-Host 'latest.json 未上传到 Release。'
            Write-Host '此前这里只打印 Notice 后 exit 0，导致多个版本一路发布、客户端却永远无法自动更新。'
            Write-Host '请检查：TAURI_SIGNING_PRIVATE_KEY 是否已配置、bundle.createUpdaterArtifacts 是否为 true、'
            Write-Host 'plugins.updater.pubkey 与私钥是否同属一对密钥。'
            Write-Error "latest.json was not uploaded to release $tag"
            exit 1
          }

          $manifestPath = Join-Path "updater-check" "latest.json"
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          if (-not $manifest.version) {
            Write-Error "latest.json is missing version"
            exit 1
          }
          $packageVersion = (Get-Content -LiteralPath "mod_UI\package.json" -Raw | ConvertFrom-Json).version
          if ($manifest.version -ne $packageVersion) {
            Write-Error "latest.json version $($manifest.version) does not match package.json version $packageVersion"
            exit 1
          }
          if (-not $manifest.platforms) {
            Write-Error "latest.json is missing platforms"
            exit 1
          }
          $platforms = $manifest.platforms.PSObject.Properties
          if ($platforms.Count -lt 1) {
            Write-Error "latest.json platforms is empty"
            exit 1
          }
          foreach ($platform in $platforms) {
            if (-not $platform.Value.url) {
              Write-Error "latest.json platform $($platform.Name) is missing url"
              exit 1
            }
            if (-not $platform.Value.signature) {
              Write-Error "latest.json platform $($platform.Name) is missing signature"
              exit 1
            }
          }
          Write-Host "latest.json updater manifest validated successfully!"
          $global:LASTEXITCODE = 0
          exit 0

      # 结构校验通过还不够：真正决定「应用内更新能不能装」的是签名密钥是否与
      # 内置公钥同属一对、以及清单里的 URL 是否真能下载。这里直接复用本地
      # 自检脚本，把整条链路（公钥解析、私钥一致性、远端清单、资产可达）一次验完。
      - name: Verify updater chain end to end
        working-directory: mod_UI
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for ($i = 1; $i -le 3; $i++) {
            Write-Host "更新链路自检 第 $i/3 次"
            node scripts/verify_updater.mjs
            if ($LASTEXITCODE -eq 0) { break }
            if ($i -eq 3) { exit $LASTEXITCODE }
            Write-Host '可能遇到 CDN 缓存延迟，10 秒后重试……'
            Start-Sleep -Seconds 10
          }

      - name: Preserve Windows installers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers-${{ env.RELEASE_TAG }}
          if-no-files-found: warn
          path: |
            mod_UI/src-tauri/target/release/bundle/msi/*.msi
            mod_UI/src-tauri/target/release/bundle/msi/*.sig
            mod_UI/src-tauri/target/release/bundle/nsis/*.exe
            mod_UI/src-tauri/target/release/bundle/nsis/*.sig
